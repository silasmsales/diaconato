@if (isOpen) {
  <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm overflow-y-auto animate-fade-in">
    <div class="glass-panel border border-slate-700/60 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5 my-8">
      <div class="flex items-center justify-between border-b border-slate-800 pb-4">
        <div>
          <h3 class="text-lg font-bold text-white">Escalar Obreiro</h3>
          <p class="text-xs text-slate-400">Selecione o culto, o mês e o membro a ser escalado</p>
        </div>
        <button 
          type="button" 
          (click)="onCancel()"
          class="p-1 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition-colors">
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Mês de Referência *
          </label>
          <select 
            formControlName="id_mes"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 text-sm transition-all">
            <option [value]="null" disabled>Selecione o mês...</option>
            @for (m of meses; track m.id_mes) {
              <option [value]="m.id_mes">{{ formatMesReferencia(m) }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Culto / Evento *
          </label>
          <select 
            formControlName="id_evento"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 text-sm transition-all">
            <option [value]="null" disabled>Selecione o evento...</option>
            @for (e of eventos; track e.id_evento) {
              <option [value]="e.id_evento">{{ e.data | date:'dd/MM/yyyy' }} - {{ e.descricao }}</option>
            }
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">
            Obreiro *
          </label>
          <select 
            formControlName="id_obreiro"
            class="w-full px-3.5 py-2.5 bg-slate-900/90 border border-slate-700/70 rounded-xl text-slate-100 focus:outline-none focus:border-indigo-500 text-sm transition-all">
            <option [value]="null" disabled>Selecione um obreiro...</option>
            @for (ob of availableObreiros(); track ob.id_obreiro) {
              <option [value]="ob.id_obreiro">
                {{ ob.nome }}{{ ob.apelido ? ' (' + ob.apelido + ')' : '' }} {{ ob.diacono ? '[Diácono]' : '[Obreiro]' }}{{ ob.pulpito ? ' [Púlpito]' : '' }}
              </option>
            }
          </select>
        </div>

        @if (conflictWarning()) {
          <div class="p-3.5 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs space-y-1 flex items-start gap-2.5">
            <svg class="w-5 h-5 flex-shrink-0 text-amber-400 mt-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <div>
              <span class="font-bold block">Aviso de Indisponibilidade:</span>
              <span>{{ conflictWarning() }}</span>
            </div>
          </div>
        }

        <div class="flex items-center justify-end gap-3 pt-3 border-t border-slate-800">
          <button 
            type="button" 
            (click)="onCancel()"
            class="px-4 py-2 text-sm font-medium text-slate-300 hover:text-white bg-slate-800 hover:bg-slate-700 rounded-xl transition-all">
            Cancelar
          </button>
          <button 
            type="submit" 
            [disabled]="form.invalid || loading"
            class="px-5 py-2 text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-500 disabled:opacity-50 disabled:cursor-not-allowed rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center gap-2">
            @if (loading) {
              <span class="w-4 h-4 border-2 border-white/20 border-t-white rounded-full animate-spin"></span>
            }
            Adicionar à Escala
          </button>
        </div>
      </form>
    </div>
  </div>
}
